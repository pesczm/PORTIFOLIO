<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chisola Nyala</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

:root{
--gold:#d4af37;
--black:#000;
--white:#fff;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:'Poppins',sans-serif;

background:
linear-gradient(
rgba(0,0,0,.75),
rgba(0,0,0,.75)
),
url('images/bg.jpg');

background-size:cover;
background-position:center;

text-align:center;
}

.container{
padding:40px;
}

h1{
font-family:'Playfair Display',serif;
font-size:5rem;
color:var(--gold);
margin-bottom:15px;
}

.subtitle{
font-size:1.2rem;
color:white;
margin-bottom:40px;
}

.buttons{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
}

.btn{
padding:15px 35px;
border-radius:40px;
font-weight:600;
text-decoration:none;
transition:.3s;
min-width:230px;
}

.website-btn{
background:var(--gold);
color:black;
}

.website-btn:hover{
background:#b8902c;
transform:translateY(-3px);
}

.contact-btn{
border:2px solid var(--gold);
color:white;
}

.contact-btn:hover{
background:var(--gold);
color:black;
transform:translateY(-3px);
}

@media(max-width:768px){

h1{
font-size:3rem;
}

.subtitle{
font-size:1rem;
}

.btn{
width:100%;
}

}

</style>
</head>
<body>

<div class="container">

<h1>Chisola Nyala</h1>

<p class="subtitle">
Electrical Engineer • Renewable Energy Specialist
</p>

<div class="buttons">

<a href="home.html" class="btn website-btn">
Enter Website
</a>

<a href="contact.html" class="btn contact-btn">
Book a Consultation
</a>

</div>

</div>

</body>
</html>
